default debian
timeout 30
menu title DE1-SoC Debian 12

label debian
    menu label Debian 12 ARMHF - DE1-SoC bring-up
    kernel /zImage
    fdt /socfpga_cyclone5_de1soc.dtb
    append root=PARTUUID=de1a2026-02 rootfstype=ext4 rw rootwait console=ttyS0,115200n8

label reference-dtb
    menu label Diagnostic fallback - original SoCDK device tree
    kernel /zImage
    fdt /socfpga_cyclone5_socdk.dtb
    append root=PARTUUID=de1a2026-02 rootfstype=ext4 rw rootwait console=ttyS0,115200n8
